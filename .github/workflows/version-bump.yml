name: Bump minor version on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Guards against a lost race if two PRs merge close together: pull any
      # commits (e.g. another concurrent run's bump) that landed on main
      # after this job's checkout, before we compute the next version.
      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Bump minor version
        run: npm version minor --no-git-tag-version --no-commit-hooks

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          git commit -m "chore: bump version to v${NEW_VERSION} [skip ci]"
          git push origin HEAD:main
